[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal
commerce-domain = { path = "crates/domain" }
commerce-app = { path = "crates/app" }
commerce-stripe = { path = "crates/stripe-client" }
commerce-store = { path = "crates/store" }
commerce-api = { path = "crates/api" }
commerce-worker = { path = "crates/worker" }

# async + http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "propagate-header", "timeout", "limit", "sensitive-headers", "catch-panic"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query"] }

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "time", "json"] }

# security
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
secrecy = { version = "0.10", features = ["serde"] }

# config, errors, telemetry
figment = { version = "0.10", features = ["env", "toml"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
float_arithmetic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
