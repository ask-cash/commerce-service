openapi: 3.1.0
info:
  title: commerce-service internal API
  version: 1.0.0
  description: |
    Called by Cash only. Every request carries a short-lived Ed25519 JWT
    (`Authorization: Bearer ...`, `kid` header, `iss`/`aud`/`sub`/`iat`/`exp`,
    lifetime <= 600 s, space-separated `scope`). Every POST requires an
    `Idempotency-Key` header. Every response carries `x-request-id`.
    Breaking changes go to /v2; additive changes only within v1.
servers:
  - url: http://commerce-service
security:
  - cashJwt: []
paths:
  /v1/caller:
    get:
      summary: Identify the calling service (token setup check)
      operationId: getCaller
      responses:
        "200":
          description: The authenticated caller
          content:
            application/json:
              schema:
                type: object
                required: [subject, scopes]
                properties:
                  subject: {type: string, example: cash-gateway}
                  scopes:
                    type: array
                    items: {type: string}
                    example: [billing:read, billing:write]
        "401": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    cashJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      headers:
        x-request-id:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthenticated, forbidden, not_found, conflict,
                     idempotency_key_reused, provider_rejected, provider_unavailable,
                     timeout, internal]
            message: {type: string}
