{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "commerce.name" . }}-secrets
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
  annotations:
    # Must exist before the migrate hook runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "commerce.name" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $envKey, $remoteKey := .Values.externalSecrets.remoteKeys }}
    - secretKey: {{ $envKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- end }}
