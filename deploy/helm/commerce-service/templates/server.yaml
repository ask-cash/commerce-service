apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commerce.name" . }}-server
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.hpa.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "commerce.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "commerce.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: {{ include "commerce.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          envFrom:
            {{- include "commerce.envFrom" . | nindent 12 }}
          {{- include "commerce.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            {{- include "commerce.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "commerce.name" . }}
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "commerce.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: admin, port: 9090, targetPort: admin}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "commerce.name" . }}-server
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "commerce.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- if .Values.server.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "commerce.name" . }}-server
  labels:
    {{- include "commerce.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "commerce.name" . }}-server
  minReplicas: {{ .Values.server.hpa.minReplicas }}
  maxReplicas: {{ .Values.server.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.server.hpa.targetCPUUtilizationPercentage }}
{{- end }}
